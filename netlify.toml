# Netlify Configuration for MedNavbat.uz

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Shifokor Autentifikatsiya va Email API Redirects
[[redirects]]
  from = "/api/doctor/register"
  to = "/.netlify/functions/doctor-register"
  status = 200

[[redirects]]
  from = "/api/doctor/verify-email"
  to = "/.netlify/functions/verify-email"
  status = 200

[[redirects]]
  from = "/api/doctor/resend-verification"
  to = "/.netlify/functions/resend-verification"
  status = 200

[[redirects]]
  from = "/api/ai/chat"
  to = "/.netlify/functions/ai-chat"
  status = 200

# SPA Router Redirect (React barcha yo'llar uchun)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Xavfsizlik Sarlavhalari (Security Headers)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://images.unsplash.com https://*.supabase.co https://res.cloudinary.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://notify.eskiz.uz https://api.anthropic.com; frame-ancestors 'none';"
