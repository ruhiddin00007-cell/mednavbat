<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Circles -->
  <circle cx="1100" cy="120" r="300" fill="#14b8a6" opacity="0.08"/>
  <circle cx="100" cy="550" r="220" fill="#10b981" opacity="0.06"/>

  <!-- Logo Container -->
  <g transform="translate(100, 100)">
    <rect width="84" height="84" rx="26" fill="url(#badgeGrad)"/>
    <path d="M18 44h11l5-11 9 22 7-15 5 6h15" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="110" y="55" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff">
      Med<tspan fill="#34d399">Navbat</tspan><tspan fill="#a7f3d0" font-size="36">.uz</tspan>
    </text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="280" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Shifoxonalar uchun Onlayn
  </text>
  <text x="100" y="345" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="900" fill="#34d399" letter-spacing="-1">
    Navbat Olish Tizimi
  </text>

  <!-- Subtitle -->
  <text x="100" y="420" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">
    Shifokorlarga uydan chiqmasdan navbat oling, mutaxassis tanlang va vaqtingizni tejang.
  </text>
  <text x="100" y="460" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
    LOR • Kardiolog • Stomatolog • Xirurg • Nevropatolog • Ginekolog
  </text>

  <!-- Trust Badges -->
  <g transform="translate(100, 520)">
    <rect width="220" height="46" rx="23" fill="#ffffff" fill-opacity="0.12"/>
    <text x="110" y="29" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#6ee7b7" text-anchor="middle">
      ✓ 24/7 Onlayn Registratsiya
    </text>
    
    <g transform="translate(240, 0)">
      <rect width="210" height="46" rx="23" fill="#ffffff" fill-opacity="0.12"/>
      <text x="105" y="29" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#6ee7b7" text-anchor="middle">
        ✓ SMS & QR Chiptalar
      </text>
    </g>

    <g transform="translate(470, 0)">
      <rect width="220" height="46" rx="23" fill="#ffffff" fill-opacity="0.12"/>
      <text x="110" y="29" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#6ee7b7" text-anchor="middle">
        ✓ Malakali Shifokorlar
      </text>
    </g>
  </g>
</svg>
